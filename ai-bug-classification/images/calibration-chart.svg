<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">A high confidence score did not mean a right answer</title>
<desc id="d">Dot plot of AI answers by reported confidence, with a threshold at 0.90 above which answers are written automatically. Trustworthy confidence: wrong answers sit below the threshold; 4 answers are written and none are wrong. What the audit found: all answers are bunched between 0.86 and 0.97; 8 are written automatically and 3 of them are wrong, with no comment. Synthetic data.</desc>

<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .ink { fill: #0b0b0b; }
  .ink2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .bar { fill: #2a78d6; }
  .empty { fill: none; stroke: #c3c2b7; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.25; }
  .box-accent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.25; }
  .lane { fill: #f3f2ee; }
  .arrow { stroke: #898781; stroke-width: 1.5; fill: none; }
  .arrowhead { fill: #898781; }
  .good { fill: #0ca30c; }
  .warn { fill: #fab219; }
  .crit { fill: #d03b3b; }
  .good-s { stroke: #0ca30c; }
  .warn-s { stroke: #fab219; }
  .crit-s { stroke: #d03b3b; }
  .on-status { fill: #ffffff; }
  .on-warn { fill: #0b0b0b; }
  svg { --ring: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .ink { fill: #f0efec; }
    .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .bar { fill: #3987e5; }
    .empty { stroke: #52514e; }
    .box { fill: #242423; stroke: #52514e; }
    .box-accent { fill: #1c2a3b; stroke: #3987e5; }
    .lane { fill: #212120; }
    svg { --ring: #1a1a19; }
  }
</style>
